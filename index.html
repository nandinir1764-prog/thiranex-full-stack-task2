<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="task-container">

        <h1>Task Manager 🚀</h1>

        <p>Manage your tasks easily</p>


        <!-- =========================
             Add Task Form
        ========================== -->

        <form id="taskForm">

            <input
                type="text"
                id="taskTitle"
                placeholder="Task title"
                required
            >

            <input
                type="text"
                id="taskDescription"
                placeholder="Task description"
            >

            <button type="submit">
                Add Task
            </button>

        </form>


        <h2>Your Tasks</h2>


        <!-- =========================
             Task List
        ========================== -->

        <div id="taskList">

            <p>Loading tasks...</p>

        </div>


        <!-- =========================
             Logout
        ========================== -->

        <button id="logoutBtn">
            Logout
        </button>

    </div>


    <script>


        // ==================================================
        // Get logged-in user
        // ==================================================

        const user = JSON.parse(
            localStorage.getItem("user")
        );


        if (!user) {

            alert("Please login first.");

            window.location.href = "login.html";

        }


        const userId = user.id;


        // ==================================================
        // Get HTML elements
        // ==================================================

        const taskForm =
            document.getElementById("taskForm");

        const taskList =
            document.getElementById("taskList");

        const logoutBtn =
            document.getElementById("logoutBtn");


        // ==================================================
        // Load Tasks
        // ==================================================

        async function loadTasks() {

            try {

                const response = await fetch(
                    `http://localhost:3000/tasks?user_id=${userId}`
                );


                const tasks = await response.json();


                taskList.innerHTML = "";


                if (tasks.length === 0) {

                    taskList.innerHTML =
                        "<p>No tasks yet.</p>";

                    return;

                }


                tasks.forEach(task => {

                    const taskDiv =
                        document.createElement("div");


                    taskDiv.className =
                        "task-card";


                    taskDiv.setAttribute(
                        "data-id",
                        task.id
                    );


                    taskDiv.innerHTML = `

                        <h3>
                            ${task.title}
                        </h3>

                        <p>
                            ${task.description || ""}
                        </p>

                        <span>
                            Status: ${task.status}
                        </span>


                        <div class="task-actions">

                            <button
                                onclick="showEditForm(${task.id})"
                            >
                                ✏️ Edit
                            </button>


                            <button
                                onclick="deleteTask(${task.id})"
                            >
                                🗑️ Delete
                            </button>


                            ${
                                task.status === "Pending"
                                ?
                                `
                                <button
                                    onclick="completeTask(${task.id})"
                                >
                                    ✅ Complete
                                </button>
                                `
                                :
                                ""
                            }

                        </div>

                    `;


                    taskList.appendChild(taskDiv);

                });


            } catch (error) {

                console.error(error);

                taskList.innerHTML =
                    "<p>Cannot connect to server.</p>";

            }

        }


        // ==================================================
        // Add Task
        // ==================================================

        taskForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const title =
                    document.getElementById(
                        "taskTitle"
                    ).value;


                const description =
                    document.getElementById(
                        "taskDescription"
                    ).value;


                try {

                    const response = await fetch(
                        "http://localhost:3000/tasks",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                user_id: userId,

                                title: title,

                                description: description

                            })

                        }
                    );


                    const data =
                        await response.json();


                    if (response.ok) {

                        alert(
                            "Task added successfully! 🎉"
                        );


                        taskForm.reset();


                        loadTasks();

                    } else {

                        alert(data.error);

                    }


                } catch (error) {

                    console.error(error);

                    alert(
                        "Cannot connect to server"
                    );

                }

            }
        );


        // ==================================================
        // Show Edit Form
        // ==================================================

        function showEditForm(id) {

            const taskCard =
                document.querySelector(
                    `.task-card[data-id="${id}"]`
                );


            if (!taskCard) {

                return;

            }


            const title =
                taskCard.querySelector(
                    "h3"
                ).textContent.trim();


            const description =
                taskCard.querySelector(
                    "p"
                ).textContent.trim();


            taskCard.innerHTML = `

                <h3>
                    Edit Task
                </h3>


                <input
                    type="text"
                    id="editTitle-${id}"
                    value="${title}"
                    placeholder="Task title"
                >


                <input
                    type="text"
                    id="editDescription-${id}"
                    value="${description}"
                    placeholder="Task description"
                >


                <div class="task-actions">

                    <button
                        onclick="editTask(${id})"
                    >
                        💾 Save
                    </button>


                    <button
                        onclick="loadTasks()"
                    >
                        ❌ Cancel
                    </button>

                </div>

            `;

        }


        // ==================================================
        // Edit / Update Task
        // ==================================================

        async function editTask(id) {

            const newTitle =
                document.getElementById(
                    `editTitle-${id}`
                ).value;


            const newDescription =
                document.getElementById(
                    `editDescription-${id}`
                ).value;


            if (newTitle.trim() === "") {

                alert(
                    "Task title cannot be empty."
                );

                return;

            }


            try {

                // Get current task
                const response =
                    await fetch(
                        `http://localhost:3000/tasks?user_id=${userId}`
                    );


                const tasks =
                    await response.json();


                const task =
                    tasks.find(
                        task => task.id === id
                    );


                if (!task) {

                    alert("Task not found.");

                    return;

                }


                // Update task
                const updateResponse =
                    await fetch(
                        `http://localhost:3000/tasks/${id}`,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                user_id: userId,

                                title: newTitle,

                                description:
                                    newDescription,

                                status: task.status

                            })

                        }
                    );


                const data =
                    await updateResponse.json();


                if (updateResponse.ok) {

                    alert(
                        "Task updated successfully! ✅"
                    );


                    loadTasks();

                } else {

                    alert(data.error);

                }


            } catch (error) {

                console.error(error);

                alert(
                    "Cannot connect to server"
                );

            }

        }


        // ==================================================
        // Delete Task
        // ==================================================

        async function deleteTask(id) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this task?"
                );


            if (!confirmDelete) {

                return;

            }


            try {

                const response =
                    await fetch(
                        `http://localhost:3000/tasks/${id}?user_id=${userId}`,
                        {
                            method: "DELETE"
                        }
                    );


                const data =
                    await response.json();


                if (response.ok) {

                    alert(
                        "Task deleted successfully! 🗑️"
                    );


                    loadTasks();

                } else {

                    alert(data.error);

                }


            } catch (error) {

                console.error(error);

                alert(
                    "Cannot connect to server"
                );

            }

        }


        // ==================================================
        // Complete Task
        // ==================================================

        async function completeTask(id) {

            try {

                // Get current tasks
                const response =
                    await fetch(
                        `http://localhost:3000/tasks?user_id=${userId}`
                    );


                const tasks =
                    await response.json();


                const task =
                    tasks.find(
                        task => task.id === id
                    );


                if (!task) {

                    alert(
                        "Task not found."
                    );

                    return;

                }


                // Mark task as completed
                const updateResponse =
                    await fetch(
                        `http://localhost:3000/tasks/${id}`,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                user_id: userId,

                                title:
                                    task.title,

                                description:
                                    task.description || "",

                                status:
                                    "Completed"

                            })

                        }
                    );


                const data =
                    await updateResponse.json();


                if (updateResponse.ok) {

                    alert(
                        "Task completed! ✅"
                    );


                    loadTasks();

                } else {

                    alert(data.error);

                }


            } catch (error) {

                console.error(error);

                alert(
                    "Cannot connect to server"
                );

            }

        }


        // ==================================================
        // Logout
        // ==================================================

        logoutBtn.addEventListener(
            "click",
            function() {

                localStorage.removeItem(
                    "user"
                );


                window.location.href =
                    "login.html";

            }
        );


        // ==================================================
        // Load tasks when page opens
        // ==================================================

        loadTasks();


    </script>

</body>

</html>
